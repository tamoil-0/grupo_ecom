<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#FF6B2B"/>
    </linearGradient>
  </defs>

  <!-- Icono cuatro cuadrantes -->
  <g transform="translate(10,15)">
    <!-- Cuadrante azul oscuro -->
    <path d="M35,0 A35,35 0 0,1 70,35 L35,35 Z" fill="#0D1B2A"/>
    <!-- Cuadrante azul claro -->
    <path d="M70,35 A35,35 0 0,1 35,70 L35,35 Z" fill="#2D7DD2"/>
    <!-- Cuadrante dorado -->
    <path d="M35,70 A35,35 0 0,1 0,35 L35,35 Z" fill="url(#goldGrad)"/>
    <!-- Cuadrante gris -->
    <path d="M0,35 A35,35 0 0,1 35,0 L35,35 Z" fill="#8A9BB0"/>
    <!-- Anillo central -->
    <circle cx="35" cy="35" r="8" fill="#FFFFFF"/>
    <circle cx="35" cy="35" r="4" fill="#0D1B2A"/>
  </g>

  <!-- Texto -->
  <g transform="translate(95,40)">
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="2">GROUP EMG</text>
    <text x="0" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#F5A623" letter-spacing="6">PERÚ</text>
  </g>
</svg>
