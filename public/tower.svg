<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="towerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4F8A"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#towerBg)"/>

  <!-- Estrellas -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="80" cy="60" r="1"/>
    <circle cx="180" cy="40" r="1.5"/>
    <circle cx="380" cy="80" r="1"/>
    <circle cx="500" cy="50" r="1.2"/>
    <circle cx="550" cy="120" r="1"/>
  </g>

  <!-- Torre centrada -->
  <g transform="translate(300,80)" stroke="#F5A623" stroke-width="2.5" fill="none">
    <!-- Diagonal estructural -->
    <line x1="100" y1="500" x2="-60" y2="0"/>
    <line x1="-100" y1="500" x2="60" y2="0"/>
    <line x1="-60" y1="0" x2="60" y2="0"/>
    <!-- Cruzes horizontales -->
    <line x1="-55" y1="50" x2="55" y2="50"/>
    <line x1="-50" y1="100" x2="50" y2="100"/>
    <line x1="-45" y1="150" x2="45" y2="150"/>
    <line x1="-40" y1="200" x2="40" y2="200"/>
    <line x1="-35" y1="250" x2="35" y2="250"/>
    <line x1="-30" y1="300" x2="30" y2="300"/>
    <line x1="-25" y1="350" x2="25" y2="350"/>
    <line x1="-20" y1="400" x2="20" y2="400"/>
    <line x1="-15" y1="450" x2="15" y2="450"/>

    <!-- Diagonales internas -->
    <line x1="-55" y1="50" x2="55" y2="100"/>
    <line x1="55" y1="50" x2="-55" y2="100"/>
    <line x1="-50" y1="100" x2="50" y2="150"/>
    <line x1="50" y1="100" x2="-50" y2="150"/>
    <line x1="-45" y1="150" x2="45" y2="200"/>
    <line x1="45" y1="150" x2="-45" y2="200"/>
    <line x1="-40" y1="200" x2="40" y2="250"/>
    <line x1="40" y1="200" x2="-40" y2="250"/>
    <line x1="-35" y1="250" x2="35" y2="300"/>
    <line x1="35" y1="250" x2="-35" y2="300"/>

    <!-- Brazos -->
    <line x1="-140" y1="20" x2="140" y2="20"/>
    <line x1="-110" y1="80" x2="110" y2="80"/>
    <line x1="-130" y1="-30" x2="130" y2="-30"/>

    <!-- Soportes brazos -->
    <line x1="-140" y1="20" x2="-60" y2="0"/>
    <line x1="140" y1="20" x2="60" y2="0"/>
    <line x1="-110" y1="80" x2="-50" y2="50"/>
    <line x1="110" y1="80" x2="50" y2="50"/>
  </g>

  <!-- Aisladores -->
  <g fill="#FFFFFF">
    <circle cx="160" cy="105" r="5"/>
    <circle cx="300" cy="105" r="5"/>
    <circle cx="440" cy="105" r="5"/>
    <circle cx="190" cy="165" r="4"/>
    <circle cx="410" cy="165" r="4"/>
    <circle cx="170" cy="55" r="4"/>
    <circle cx="430" cy="55" r="4"/>
  </g>

  <!-- Base -->
  <rect x="180" y="580" width="240" height="20" fill="#07111B"/>
</svg>
