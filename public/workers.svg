<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2E45"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Suelo -->
  <rect x="0" y="700" width="800" height="300" fill="#07111B"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#F5A623" stroke-width="2" opacity="0.5"/>

  <!-- Trabajador 1 -->
  <g transform="translate(280,400)">
    <!-- Casco -->
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="#F5A623"/>
    <rect x="-42" y="-5" width="84" height="8" fill="#FF6B2B"/>
    <!-- Cabeza -->
    <circle cx="0" cy="30" r="25" fill="#D9A07A"/>
    <!-- Cuerpo -->
    <path d="M -40,60 L 40,60 L 50,200 L -50,200 Z" fill="#F5A623"/>
    <!-- Bandas reflectivas -->
    <rect x="-45" y="100" width="90" height="6" fill="#FFFFFF"/>
    <rect x="-45" y="150" width="90" height="6" fill="#FFFFFF"/>
    <!-- Brazos -->
    <rect x="-65" y="65" width="20" height="120" fill="#F5A623" rx="6"/>
    <rect x="45" y="65" width="20" height="120" fill="#F5A623" rx="6"/>
    <!-- Piernas -->
    <rect x="-35" y="200" width="25" height="120" fill="#1B4F8A"/>
    <rect x="10" y="200" width="25" height="120" fill="#1B4F8A"/>
    <!-- Botas -->
    <rect x="-38" y="315" width="30" height="15" fill="#07111B"/>
    <rect x="8" y="315" width="30" height="15" fill="#07111B"/>
  </g>

  <!-- Trabajador 2 (atrás) -->
  <g transform="translate(500,450)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="34" ry="26" fill="#F5A623"/>
    <rect x="-35" y="-3" width="70" height="6" fill="#FF6B2B"/>
    <circle cx="0" cy="25" r="20" fill="#A87F60"/>
    <path d="M -32,50 L 32,50 L 40,170 L -40,170 Z" fill="#2D7DD2"/>
    <rect x="-38" y="85" width="76" height="5" fill="#FFFFFF"/>
    <rect x="-38" y="130" width="76" height="5" fill="#FFFFFF"/>
    <rect x="-55" y="55" width="16" height="100" fill="#2D7DD2" rx="5"/>
    <rect x="39" y="55" width="16" height="100" fill="#2D7DD2" rx="5"/>
    <rect x="-28" y="170" width="22" height="100" fill="#1B4F8A"/>
    <rect x="6" y="170" width="22" height="100" fill="#1B4F8A"/>
  </g>

  <!-- Torre al fondo -->
  <g transform="translate(150,100)" stroke="#8A9BB0" stroke-width="2" fill="none" opacity="0.4">
    <line x1="40" y1="500" x2="-30" y2="0"/>
    <line x1="-40" y1="500" x2="30" y2="0"/>
    <line x1="-30" y1="0" x2="30" y2="0"/>
    <line x1="-25" y1="60" x2="25" y2="60"/>
    <line x1="-20" y1="120" x2="20" y2="120"/>
    <line x1="-15" y1="180" x2="15" y2="180"/>
    <line x1="-100" y1="-20" x2="100" y2="-20"/>
    <line x1="-80" y1="40" x2="80" y2="40"/>
  </g>

  <!-- Etiqueta -->
  <text x="400" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#F5A623" opacity="0.4" letter-spacing="4">EQUIPO EN OBRA</text>
</svg>
